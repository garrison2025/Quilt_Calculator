name: Quilt public Cloudflare Pages verification
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/live-preview.yml'
  workflow_dispatch:
jobs:
  public-preview:
    if: github.repository == 'garrison2025/Quilt_Calculator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated public QA browser
        run: npm install --no-save --package-lock=false playwright
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for exact Cloudflare commit and verify real public interactions
        run: node scripts/live-preview-smoke.mjs
        env:
          QUILT_PREVIEW_URL: https://quilt-calculator-566.pages.dev
