name: Quilt dependency major-upgrade compatibility trial
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dependency-upgrade-trial.yml"
      - "package.json"
      - "package-lock.json"
permissions:
  contents: read
jobs:
  isolated-upgrade-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact currently locked source
        run: npm ci --no-audit --no-fund
      - name: Try targeted patched majors in disposable runner only
        run: |
          npm install --save-exact --no-audit --no-fund astro@7.4.7 sharp@0.35.5
          npm install --save-dev --save-exact --no-audit --no-fund vitest@5.1.0 esbuild@0.28.1
          npm ci --no-audit --no-fund
          npm ls astro sharp vitest
      - name: TypeScript and 198+ V2 calculations
        run: |
          npm run lint
          npm test
      - name: Build and static SEO/geometry release checks
        run: |
          npm run build
          node scripts/check-build.mjs
      - name: Check real browser interactions against candidate majors
        run: |
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install --with-deps chromium
          node scripts/browser-smoke.mjs
      - name: Audit candidate dependency tree
        if: always()
        run: |
          mkdir -p artifacts/security
          npm audit --json > artifacts/security/upgrade-trial-audit.json || true
          node -e "const d=require('./artifacts/security/upgrade-trial-audit.json');const v=d.metadata?.vulnerabilities||{};console.log('TRIAL AUDIT COUNTS '+JSON.stringify(v));if(v.total!==0)process.exitCode=1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quilt-major-upgrade-disposable-trial
          path: |
            artifacts/security/upgrade-trial-audit.json
            package.json
            package-lock.json
          retention-days: 7
