name: Quilt build validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint
      - name: Verify mathematics
        run: npm test
      - name: Build Astro
        run: npm run build
      - name: Inspect static output and index gates
        run: node scripts/check-build.mjs
      - name: Verify future dual-host indexing guard semantics offline
        run: node scripts/check-live-hosts.mjs --self-test
      - name: Install isolated browser smoke-test dependency
        run: npm install --no-save --package-lock=false playwright axe-core
      # GitHub ubuntu-latest normally ships standard browser system libraries.
      # Avoid a full apt mirror update/install on EVERY PR: it can stall CI for
      # minutes before any real browser interaction is exercised. Browser
      # launch itself is still required, and missing native libs fail the QA.
      - name: Install isolated Chromium browser
        run: npx playwright install chromium
      - name: Ensure PDF text/render inspection tools are available
        run: |
          if ! command -v pdftotext >/dev/null 2>&1 || ! command -v pdfinfo >/dev/null 2>&1 || ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
      - name: Test real calculator interactions, downloads, mobile and print
        timeout-minutes: 6
        run: node scripts/browser-smoke.mjs
      # WebKit needs additional GTK/GStreamer/native runtime packages on
      # ubuntu-latest, unlike Chromium. Install its dependencies explicitly;
      # the mobile smoke MUST launch real WebKit or fail CI.
      - name: Install WebKit and its required native system libraries
        run: npx playwright install --with-deps webkit
      - name: Exercise touch and pan in simulated iPhone WebKit and Android Chrome
        timeout-minutes: 5
        run: node scripts/mobile-touch-smoke.mjs
      - name: Archive desktop, mobile and print smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quilt-browser-qa
          path: artifacts/qa/
          if-no-files-found: ignore
          retention-days: 7

  # Simulate Cloudflare's automatic main-branch build variables offline.
  # No user-defined SEO environment variables are required. The separate
  # default quality job still verifies all preview/local builds are noindex.
  production-seo-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and statically validate the approved main-branch production origin offline
        env:
          CF_PAGES: '1'
          CF_PAGES_BRANCH: main
        run: |
          npm run build
          node scripts/check-build.mjs
      - name: Verify generated canonical and index policy for every approved route
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const site='https://quiltcutplanner.com';
          const paths=['/','/calculators/','/quilt-backing-calculator/','/quilt-binding-calculator/','/quilt-border-calculator/','/fabric-yardage-calculator/','/quilt-fabric-calculator/','/fabric-yards-to-inches/','/quilt-batting-calculator/','/quilt-sashing-calculator/','/about/','/privacy/'];
          for(const path of paths){
            const html=fs.readFileSync('dist'+path+'index.html','utf8');
            assert.ok(html.includes('name="robots" content="index,follow,max-image-preview:large"'), 'Production robots missing: '+path);
            assert.ok(html.includes('rel="canonical" href="'+site+path+'"'), 'Exact absolute canonical missing: '+path);
          }
          for(const path of ['/lab/square-in-square/','/lab/continuous-bias-physical/','/qa/print-calibration/','/qa/fabric-cutting/']){
            const html=fs.readFileSync('dist'+path+'index.html','utf8');
            assert.ok(html.includes('noindex,follow')&&!html.includes('rel="canonical"'), 'QA lab leaked index eligibility: '+path);
          }
          console.log('PASS approved-domain offline SEO build and research noindex; Cloudflare live settings were not changed.');
          NODE

  # Continuous, read-only audit against the already deployed official domain:
  # verify the actual HTTP X-Robots-Tag on pages.dev (HTML meta alone cannot
  # establish this), canonical, sitemap, and QA/HOLD isolation.
  live-seo-host-audit:
    # A pull request changes the expected indexable pages before Cloudflare
    # production does. Audit the live release only after main is deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for matching Cloudflare Pages main deployment on both hosts
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const expected=process.env.EXPECTED_SHA;
          const hosts=[
            {name:'custom domain',url:'https://quiltcutplanner.com/'},
            {name:'Pages.dev mirror',url:'https://quilt-calculator-566.pages.dev/'}
          ];
          let last={};
          for(let attempt=1;attempt<=24;attempt++){
            const observed=await Promise.all(hosts.map(async host=>{
              try{
                const response=await fetch(host.url,{
                  cache:'no-store',headers:{'Cache-Control':'no-cache'},
                  signal:AbortSignal.timeout(15000)
                });
                if(!response.ok)throw Error('HTTP '+response.status);
                const html=await response.text();
                const sha=html.match(/name="quilt-build-commit" content="([a-f0-9]{40})"/i)?.[1]||'missing';
                return {name:host.name,sha};
              }catch(error){
                return {name:host.name,sha:'unavailable',error:String(error)};
              }
            }));
            last=Object.fromEntries(observed.map(item=>[item.name,item.sha]));
            if(observed.every(item=>item.sha===expected)){
              console.log('Cloudflare deployed '+expected+' on both custom domain and Pages.dev mirror.');
              process.exit(0);
            }
            console.log('Deployment not yet synchronized, attempt '+attempt+': '+JSON.stringify(last));
            if(attempt<24)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw Error('Cloudflare main deployment did not synchronize across both hosts. Expected '+expected+', saw '+JSON.stringify(last));
          NODE
      - name: Verify owner domain and Pages mirror robots, canonicals, sitemap
        run: node scripts/check-live-hosts.mjs --production=https://quiltcutplanner.com
