name: Quilt build validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint
      - name: Verify mathematics
        run: npm test
      - name: Build Astro
        run: npm run build
      - name: Inspect static output and index gates
        run: node scripts/check-build.mjs
