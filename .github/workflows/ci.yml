name: Quilt build validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript lint
        run: npm run lint
      - name: Verify mathematics
        run: npm test
      - name: Build Astro
        run: npm run build
      - name: Inspect static output and index gates
        run: node scripts/check-build.mjs
      - name: Persist exact dependency versions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: record validated dependency lockfile"
            git push origin HEAD:main
          fi
